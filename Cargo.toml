[workspace]
resolver = "2"
members = [
    "crates/embr-hidpp",
    "crates/embr-core",
    # The tray icons and the notifications: D-Bus, toolkit-free, so that the window layer holds
    # no D-Bus code and one function decides what a tray icon looks like.
    "crates/embr-desktop",
    "crates/embr-app",
]
# The spikes are experiments with their own dependency trees (Slint, iced, egui, GTK). Without this
# list every one of them fails to build inside the repo with "current package believes it's in a
# workspace when it's not" — `cargo build` in `spikes/002a-slint-gui`, say, has been broken since the
# workspace was introduced. The paths have to be spelled out: `exclude = ["spikes/*"]` is accepted by
# cargo but does not exclude anything (measured), while explicit paths do.
exclude = [
    "spikes/001-rust-hidpp-battery",
    "spikes/002a-slint-gui",
    "spikes/002b-iced-gui",
    "spikes/002c-egui-gui",
    "spikes/003-tray-and-notifications",
    "spikes/004-gtk4-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jensen"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jensend6965/embr"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
# Tray item and desktop notifications: both proven on this desktop by spike 003.
ksni = "0.2"
notify-rust = "4"
# The window (crates/embr-app, GTK 4 + libadwaita). The version features are mandatory and not
# cumulative: without v1_4 `ExpanderRowExt` is missing from the prelude, a colour picker needs
# v4_10, and a method that exists in C is invisible in Rust without them (measured in spike 004).
#
# **Keep them at the minimum the window actually uses.** Each one is a claim about the system
# libraries: `gtk4-sys`'s `[package.metadata.system-deps]` maps every feature to the library version
# it needs (`v4_24` → 4.24, `v1_10` → 1.10), and `system-deps` fails the build script — `exit(1)`,
# before a line of our code is compiled — when the installed library is older than the highest one
# enabled. A list that claimed 4.24/1.10 therefore built on this machine (GTK 4.24.1, libadwaita
# 1.10.0) and nowhere else: CI, on `ubuntu-latest` (Ubuntu 24.04, GTK 4.14, libadwaita 1.5), failed
# in 57 seconds with nothing but `Process completed with exit code 101`. The two newest items the
# window uses are `CssProvider::load_from_string` (4.12) and the settings dialog's
# `content_height`/`content_width` sizing (1.5); a longer list buys nothing and costs builders.
gtk4 = { version = "0.11.5", features = [
    "v4_4",
    "v4_6",
    "v4_8",
    "v4_10",
    "v4_12",
] }
adw = { package = "libadwaita", version = "0.9.2", features = [
    "v1_1",
    "v1_2",
    "v1_3",
    "v1_4",
    "v1_5",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# HID++ work is I/O bound; a debug build that is not absurdly slow is worth more than
# maximum debuggability for a device monitor.
opt-level = 1
